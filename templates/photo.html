<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Galerie</title>
    <style>
        /* Import d'une police plus élégante */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        :root {
            --primary: #4361ee;
            --primary-hover: #3a56d4;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #2d3436;
            --accent: #424270;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            font-weight: 600;
            letter-spacing: -1px;
            color: var(--accent);
            margin-bottom: 30px;
            text-transform: uppercase;
            font-size: 1.8rem;
        }

        /* Effet de carte moderne */
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: 600;
            border-left: 4px solid var(--primary);
            padding-left: 12px;
        }

        /* Champs de saisie stylisés */
        input[type="text"],
        select,
        input[type="number"] {
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid #edf2f7;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            background: #f8fafc;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }

        /* Boutons avec dégradés */
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background: #313156;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .btn-ai {
            background: var(--primary) !important;
        }

        .btn-ai:hover {
            background: var(--primary-hover) !important;
        }

        /* Image avec bordure "Polaroid" moderne */
        .result-img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 10px;
            border: 8px solid white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .img-info {
            font-size: 0.85rem;
            color: #718096;
            margin-top: 15px;
            font-style: italic;
        }

        hr {
            border: 0;
            border-top: 1px solid #edf2f7;
            margin: 25px 0;
        }

        .btn-home {
            text-decoration: none;
            color: #718096;
            margin-top: 30px;
            font-weight: 500;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-home:hover {
            color: var(--primary);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <h1>Visionneuse </h1>

    <div class="card">
        <h3>Source des fichiers</h3>
        <form method="POST" action="/photo">
            <input type="text" name="chemin_dossier" value="{{ dossier }}"
                placeholder="Coller le chemin Windows ici...">
            <button type="submit">Scanner le répertoire</button>
        </form>
    </div>

    {% if images %}
    <div class="card">
        <h3>Explorateur</h3>
        <form method="POST" action="/photo">
            <input type="hidden" name="chemin_dossier" value="{{ dossier }}">
            <select name="menu_photos" onchange="this.form.submit()">
                <option value="">-- {{ images|length }} fichiers détectés --</option>
                {% for img in images %}
                <option value="{{ img }}" {% if img==photo_finale %}selected{% endif %}>{{ img }}</option>
                {% endfor %}
            </select>
        </form>
    </div>
    {% endif %}

    {% if photo_finale %}
    <div class="card" style="text-align: center;">
        <h3>Aperçu</h3>
        <img src="{{ url_for('image_externe', filename=photo_finale, dir=dossier) }}" class="result-img">
        <div class="img-info">{{ photo_finale }}</div>

        <hr>

        <h3>Traitement </h3>
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 20px;">
            L'algorithme <strong>K-Means</strong> va analyser chaque pixel pour simplifier l'image en groupes de
            couleurs.
        </p>

        <form action="/process_kmeans" method="POST">
            <input type="hidden" name="dossier" value="{{ dossier }}">
            <input type="hidden" name="photo" value="{{ photo_finale }}">

            <div style="text-align: left;">
                <label for="k">Précision des clusters (K) :</label>
                <input type="number" name="k" id="k" value="5" min="2" max="20">
            </div>

            <button type="submit" class="btn-ai">Lancer l'algorithme K-Means</button>
        </form>
    </div>
    {% endif %}

    <a href="/" class="btn-home">← Retour au menu principal</a>

</body>

</html>
