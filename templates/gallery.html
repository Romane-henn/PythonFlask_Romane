<!DOCTYPE html>
<html>

<head>
    <title>Ma Visionneuse Photos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;
        }

        h1 {
            color: #003366;
            margin-top: 20px;
        }

        .main-content {
            padding: 20px;
            display: inline-block;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        input[type="text"] {
            padding: 5px;
            width: 300px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 6px 12px;
            border: none;
            background-color: #003366;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0055a5;
        }

        select {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 320px;
        }

        .affichage-unique img {
            max-width: 100%;
            max-height: 500px;
            border: 10px solid white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-top: 10px;
            border-radius: 8px;
        }

        .nav-link {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #003366;
            font-weight: bold;
        }

        .nav-link:hover {
            color: #0055a5;
        }
    </style>
</head>

<body>
    <h1>Visionneuse Photo</h1>

    <div class="main-content">
        <!-- Formulaire pour choisir le dossier -->
        <form method="POST" action="/gallery">
            <label>Étape 1 - Choisir le dossier :</label>
            <input type="text" name="chemin" value="{{ chemin }}" placeholder="Ex : C:/Users/...">
            <button type="submit" class="nav-link" style="margin-left:10px;">Scanner</button>
        </form>

        {% if erreur %}
        <p style="color:red;">{{ erreur }}</p>
        {% endif %}

        <hr>

        {% if images %}
        <!-- Sélection de l'image -->
        <form method="GET" action="/gallery">
            <input type="hidden" name="chemin" value="{{ chemin }}">
            <label>Sélectionner l'image :</label>
            <select name="image_selectionnee" onchange="this.form.submit()">
                <option value="">-- Choisir une photo --</option>
                {% for img in images %}
                <option value="{{ img }}" {% if img==image_choisie %}selected{% endif %}>{{ img }}</option>
                {% endfor %}
            </select>
        </form>
        {% endif %}

        <!-- Affichage de l'image -->
        <div class="affichage-unique" style="margin-top: 30px;">
            {% if image_choisie %}
            <h3>{{ image_choisie }}</h3>
            <img src="{{ url_for('image_brute', nom_image=image_choisie, dossier=chemin) }}">
            {% else %}
            <p>Aucune image sélectionnée.</p>
            {% endif %}
        </div>
    </div>

    <a href="{{ url_for('home') }}" class="nav-link">Retour à l'accueil</a>
</body>

</html>
