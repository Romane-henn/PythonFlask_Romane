<!DOCTYPE html>
<html>

<head>
    <title>Galerie d'images</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f4f4;
        }

        nav {
            background-color: #003366;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        .dropdown {
            display: inline-block;
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 150px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .dropdown-content a {
            color: black;
            padding: 10px;
            display: block;
            text-decoration: none;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            justify-content: center;
        }

        .gallery img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        h1 {
            text-align: center;
            color: #003366;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="http://127.0.0.1:5001/">Accueil</a>
        <a href="http://127.0.0.1:5001/map">Carte</a>
        <div class="dropdown">
            <a href="#">Menu ▼</a>
            <div class="dropdown-content">
                <a href="http://127.0.0.1:5001/about">À propos de moi</a>
                <a href="http://127.0.0.1:5001/projects">Mes projets</a>
                <a href="http://127.0.0.1:5001/gallery">Galerie d'images</a>
            </div>
        </div>
    </nav>

    <h1>Galerie d'images</h1>
    <div class="gallery">
        {% for img in images %}
        <img src="{{ url_for('static', filename='images/' + img) }}" alt="{{ img }}">
        {% endfor %}
    </div>

</body>

</html>
