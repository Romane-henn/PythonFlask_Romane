<!DOCTYPE html>
<html>

<head>
    <title>Carte de localisation</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>Ma Carte de Localisation</h1>
    <a href="/">Retour accueil</a>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        var map = L.map('map').setView([50.9513, 1.8587], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        L.marker([50.9513, 1.8587]).addTo(map)
            .bindPopup("ULCO Calais")
            .openPopup();
    </script>

</body>

</html>
