<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Mon Application Flask</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .menu {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            text-decoration: none;
            background: #4361ee;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        .btn.alt {
            background: #2d3436;
        }
    </style>
</head>

<body>
    <div class="menu">
        <h1>🚀 Menu Principal</h1>
        <div class="links">
            <a href="/photo" class="btn">📷 Galerie Photo</a>
            <a href="/kmeans" class="btn">🧠 Labo K-Means</a>
            <a href="/about" class="btn alt">ℹ️ À propos</a>
            <a href="/map" class="btn alt">🗺️ Carte</a>
            <a href="/projects" class="btn alt" style="grid-column: span 2;">📁 Mes Projets</a>
            <a href="/hierarchie" class="card">🌳 Analyse Hiérarchique</a>
        </div>
    </div>
</body>
